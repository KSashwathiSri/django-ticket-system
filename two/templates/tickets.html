{% extends 'base.html' %}
{% block content %}

<style>
    /* Clean CSS Grid for recursive ticket cards instead of hardcoded row containers */
    .ticket-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        width: 100%;
        padding: 10px 0;
    }
    .col {
        margin: 0;
    }
    .ticket-card .text {
        width: 100%;
    }
    .ticket-actions {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }
    .btn-action {
        text-decoration: none;
        font-size: 10px;
        font-weight: bold;
        padding: 2px 6px;
        border-radius: 3px;
        background-color: rgba(255, 255, 255, 0.2);
        transition: background 0.2s ease;
    }
    .btn-action:hover {
        background-color: rgba(255, 255, 255, 0.4);
    }
    .btn-delete {
        color: #ffffff;
    }
    .btn-edit {
        color: #ffffff;
    }
</style> 

<div class="searchbar2">
    <input type="text" id="ticketSearchInput" placeholder="Search Ticket By Subject or ID...">
    <div class="searchbtn">
        <img src="https://media.geeksforgeeks.org/wp-content/uploads/20221210180758/Untitled-design-(28).png"
            class="icn srchicn" alt="search-button">
    </div>
</div>

<div class="box-container">
    <div class="ticket-grid">
        <!-- Dynamic Loop over your database objects -->
        {% for ticket in tickets %}
        <!-- Uses built-in counter loops to dynamically match box1, box2, box3 coloring structures -->
        <div class="box box{{ forloop.counter|stringformat:"s" }} col ticket-card" data-id="{{ ticket.id }}" data-subject="{{ ticket.subject|lower }}">
            <div class="text">
                <button class="hello">ID: T{{ ticket.id }}</button><br><br>
                <button class="hello">Subject: {{ ticket.subject }}</button><br><br>
                <button class="hello">Status: {{ ticket.status }}</button>
                
                <!-- Operational Routing Links wired to urls.py names -->
                <div class="ticket-actions">
                    <a href="{% url 'update_ticket' ticket.id %}" class="btn-action btn-edit">&#9998; Edit</a>
                    <a href="{% url 'delete_ticket' ticket.id %}" class="btn-action btn-delete" onclick="return confirm('Are you sure you want to delete Ticket T{{ ticket.id }}?')">&#128465;Delete</a>
                </div>
            </div>
        </div>
        {% empty %}
        <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #555;">
            <h2>No tickets found in the management system.</h2>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", () => {
    const searchInput = document.getElementById("ticketSearchInput");
    
    if (searchInput) {
        searchInput.addEventListener("keyup", (e) => {
            const query = e.target.value.toLowerCase().trim();
            const cards = document.querySelectorAll(".ticket-card");
            
            cards.forEach(card => {
                const id = card.getAttribute("data-id").toLowerCase();
                const subject = card.getAttribute("data-subject").toLowerCase();
                
                // Matches input string against ticket fields instantly
                if (id.includes(query) || subject.includes(query)) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
        });
    }
});
</script>
{% endblock %}
