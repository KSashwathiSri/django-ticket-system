<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            margin:0;
            padding:0;
            height:100vh;
            background:linear-gradient(135deg,#d81b60,#c2185b,#ad1457);
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial,sans-serif;
        }

        .welcome-card{
            background:white;
            padding:50px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
        }

        h1{
            color:#c2185b;
            margin-bottom:20px;
            font-weight:bold;
        }

        p{
            color:#555;
            margin-bottom:30px;
        }

        .btn-go{
            background:#d81b60;
            color:white;
            padding:12px 40px;
            font-size:20px;
            border-radius:30px;
            border:none;
            transition:0.3s;
        }

        .btn-go:hover{
            background:#ad1457;
            transform:scale(1.05);
            color:white;
        }
    </style>
</head>
<body>

<div class="welcome-card">
    <h1>Welcome!</h1>
    <p>Click the button below to continue.</p>

    <a href="{% url 'login' %}" class="btn btn-go">
        Let's Go
    </a>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
