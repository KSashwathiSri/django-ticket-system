{% extends 'two/home.html' %}
{% load static %}

{% block content %}

<center>

<h1>Customer Upload</h1>
<form method="POST">
    {% csrf_token %}

    <table>
        {% for field in form %}
        <tr>
            <th>{{ field.label }}</th>
            <td>{{ field }}</td>
        </tr>
        {% endfor %}
    </table>

    <br>

    <button type="submit">Submit</button>
</form>

</center>

{% endblock %}
