
{% extends 'two/home.html' %}
{% load static %}

{% block content %}

<center>

<h1 class="display-4"
style="background-color:#8B008B; color:white; padding:15px; border-radius:10px;">
Upload Ticket
</h1>
<form method="POST">

    {% csrf_token %}
    <table class="table table-light w-50"
    style="border-radius:10px;">

        {% for field in upload_form %}
        <tr>
            <th>{{ field.label }}</th>
            <td>{{ field }}</td>
        </tr>
        {% endfor %}
    </table>
    <button type="submit"
    class="btn btn-lg btn-primary">
        Submit
    </button>
</form>
</center>
{% endblock %}
