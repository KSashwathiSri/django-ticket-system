
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body{
            background-color:#d9d9d9;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            width:500px;
            background:white;
            border-radius:30px;
            padding:90px 40px 0px;
            position:relative;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

        .profile-icon{
            position:absolute;
            top:-75px;
            left:50%;
            transform:translateX(-50%);
            width:150px;
            height:150px;
            background:#003d5c;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            border:8px solid #f1f1f1;
        }

        .profile-icon i{
            font-size:80px;
            color:white;
        }

        .close-btn{
            position:absolute;
            right:25px;
            top:20px;
            font-size:30px;
            cursor:pointer;
        }

        .custom-input{
            background:#6c98ab;
            color:white;
            border:none;
            border-radius:30px;
            padding:12px;
        }

        .custom-input::placeholder{
            color:white;
        }

        .input-group-text{
            background:white;
            border:none;
            font-size:24px;
            color:#003d5c;
        }

        .login-btn{
            width:100%;
            background:#003d5c;
            color:white;
            border:none;
            padding:18px;
            font-size:32px;
            font-weight:bold;
            margin-top:20px;
            border-radius:0 0 25px 25px;
        }

        .signup-link{
            text-align:center;
            margin-top:20px;
            margin-bottom:20px;
        }

        .signup-link a{
            color:black;
            font-style:italic;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="close-btn">
        <i class="bi bi-x-lg"></i>
    </div>

    <div class="profile-icon">
        <i class="bi bi-person-fill"></i>
    </div>

    <!-- Display Django messages -->
    {% for message in messages %}
        <div style="color:red;text-align:center;">
            {{ message }}
        </div>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        <!-- Email -->
        <div class="input-group mb-4">
            <span class="input-group-text">
                <i class="bi bi-envelope-fill"></i>
            </span>

            <input type="email"
                   name="username"
                   class="form-control custom-input"
                   placeholder="Email"
                   value="{{ request.POST.username|default:'' }}"
                   required>
        </div>

        <!-- Password -->
        <div class="input-group mb-4">
            <span class="input-group-text">
                <i class="bi bi-lock-fill"></i>
            </span>

            <input type="password"
                   name="password"
                   class="form-control custom-input"
                   placeholder="Password"
                   required>
        </div>

        <!-- Login Button -->
        <button type="submit" class="login-btn">
            LOGIN
        </button>

    </form>

    <!-- Signup -->
    <div class="signup-link">
        <a href="{% url 'signup' %}">
            Don't have an account yet? Sign up now
        </a>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
